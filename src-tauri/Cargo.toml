[package]
name = "supasito"
version = "0.1.0"
description = "Supasito — build websites with your local coding agent"
authors = ["wozu"]
edition = "2021"

[lib]
name = "supasito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "net", "fs"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
libc = "0.2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
block2 = "0.6"
